<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B0D3E">
        <animate attributeName="stop-color" dur="10s" repeatCount="indefinite"
                 values="#2B0D3E;#2B2E33;#7A3F91;#7A4A00;#2B0D3E"/>
      </stop>
      <stop offset="55%" stop-color="#7A3F91">
        <animate attributeName="offset" dur="10s" repeatCount="indefinite"
                 values="0.45;0.65;0.45"/>
      </stop>
      <stop offset="100%" stop-color="#E6A520">
        <animate attributeName="stop-color" dur="10s" repeatCount="indefinite"
                 values="#E6A520;#FFD77A;#C59DD9;#E6A520"/>
      </stop>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="g1"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font: 700 52px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .sub   { font: 500 18px system-ui, -apple-system, Segoe UI, Roboto, Arial; letter-spacing: .2px; }
      .chip  { font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#g)"/>

  <g opacity="0.55">
    <circle cx="180" cy="90" r="3" fill="#F5F6F7">
      <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="90;70;90"/>
    </circle>
    <circle cx="980" cy="220" r="3" fill="#FFF8E7">
      <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="980;1010;980"/>
    </circle>
    <circle cx="720" cy="70" r="2.5" fill="#FFD77A">
      <animate attributeName="r" dur="5s" repeatCount="indefinite" values="2.5;4;2.5"/>
    </circle>
  </g>

  <g filter="url(#blur)">
    <rect x="60" y="62" width="1080" height="196" rx="22" fill="#F2EAF7" opacity="0.10"/>
    <rect x="60" y="62" width="1080" height="196" rx="22" fill="none" stroke="#C1C4C8" opacity="0.22"/>
  </g>

  <text x="92" y="132" class="title" fill="#F5F6F7" filter="url(#glow)">Serhat</text>
  <text x="92" y="168" class="sub" fill="#F2EAF7" opacity="0.95">
    AI Systems • Edge Intelligence • Multi-Agent Architect
  </text>

  <g>
    <rect x="92" y="200" width="210" height="34" rx="17" fill="#2B2E33" opacity="0.85"/>
    <text x="110" y="223" class="chip" fill="#FFD77A">STT → LLM Router</text>

    <rect x="314" y="200" width="190" height="34" rx="17" fill="#2B2E33" opacity="0.85"/>
    <text x="332" y="223" class="chip" fill="#C59DD9">ESP32 + Cloud</text>

    <rect x="516" y="200" width="210" height="34" rx="17" fill="#2B2E33" opacity="0.85"/>
    <text x="534" y="223" class="chip" fill="#E6A520">Autonomous Agents</text>
  </g>
</svg>
