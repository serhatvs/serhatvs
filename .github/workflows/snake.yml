name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: serhatvs
          outputs: |
            dist/github-contribution-grid-snake-royal-imperial.svg

      - name: Recolor snake (gold/purple)
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dist/github-contribution-grid-snake-royal-imperial.svg")
          if not path.exists():
              raise SystemExit("snake svg was not generated")

          content = path.read_text(encoding="utf-8")
          replacements = {
              "#39d353": "#7A3F91",
              "#26a641": "#E6A520",
              "#0e4429": "#2B0D3E",
              "#d1d5da": "#F5F6F7",
              "#c6e48b": "#FFD77A",
          }
          for source, target in replacements.items():
              content = content.replace(source, target)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Deploy snake to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
