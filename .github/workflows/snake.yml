name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: serhatvs
          outputs: |
            dist/github-contribution-grid-snake-royal-imperial.svg?color_snake=%23F5F6F7&color_dots=%232B0D3E,%237A3F91,%23C59DD9,%23FFD77A,%23E6A520

      - name: Deploy snake to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
