name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: serhatvs
          outputs: |
            dist/snake.svg

      - name: Recolor snake (gold/purple)
        run: |
          sed -i 's/#39d353/#7A3F91/g' dist/snake.svg || true
          sed -i 's/#26a641/#E6A520/g' dist/snake.svg || true
          sed -i 's/#0e4429/#2B0D3E/g' dist/snake.svg || true
          sed -i 's/#d1d5da/#F5F6F7/g' dist/snake.svg || true
          sed -i 's/#c6e48b/#FFD77A/g' dist/snake.svg || true
          cp dist/snake.svg dist/github-contribution-grid-snake-royal-imperial.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
